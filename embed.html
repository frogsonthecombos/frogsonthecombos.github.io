<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frogs on the Combos 🐸</title>

    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5735920394950369"
        crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #7ddf64, #4caf50);
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 50px;

            text-align: center;

            background: white;
            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: clamp(28px, 7vw, 40px);
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
        }

        button {
            border: none;
            padding: 15px 25px;

            border-radius: 12px;

            background: #333;
            color: white;

            font-size: 18px;

            cursor: pointer;

            transition: transform 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .frog {
            font-size: 100px;
            margin: 25px;
        }

        .ad-box {
            margin-top: 35px;
            min-height: 120px;

            padding: 15px;

            border: 2px dashed #aaa;
            border-radius: 10px;
        }

        .ad-label {
            display: block;
            margin-bottom: 10px;

            font-size: 11px;
            color: #777;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>🐸 Frogs on the Combos</h1>

        <p id="message">Welcome to my random website!</p>

        <button id="frogButton">Click Me!</button>

        <div class="frog">🐸</div>

        <p>You've found the secret frog website.</p>

        <!-- Google AdSense -->
        <div class="ad-box">

            <span class="ad-label">ADVERTISEMENT</span>

            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5735920394950369"
                 data-ad-slot="YOUR_AD_SLOT"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>

            <script>
                (adsbygoogle = window.adsbygoogle || []).push({});
            </script>

        </div>

    </main>

    <script>
        const messages = [
            "🐸 Ribbit!",
            "You clicked the frog button!",
            "Welcome to the combo zone!",
            "This website actually works!",
            "🐸🐸🐸 MORE FROGS!",
            "You have discovered the secret.",
            "The frog approves."
        ];

        const button = document.getElementById("frogButton");
        const message = document.getElementById("message");

        button.addEventListener("click", function () {
            const randomMessage =
                messages[Math.floor(Math.random() * messages.length)];

            message.textContent = randomMessage;
        });
    </script>

</body>
</html>
